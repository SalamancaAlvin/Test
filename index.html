<!doctype html>
<html lang="es" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vidlo – Plataforma de video</title>
<meta name="description" content="Plataforma de video" />
<link rel="preconnect" href="https://api.fontshare.com" />
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />
<style>
:root{
  --body:#0c0c11;--soft:#15151c;--line:#262631;--lead:#ffffff;--subs:#9c9cad;--main:#7c5cff;--wins:#3ddc97;--radius:.5rem;--maxw:80rem;
}
html:not(.dark){
  --body:#f6f6f9; --soft:#ffffff; --line:#e3e3ea; --lead:#14141a; --subs:#6a6a7a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}html:not(.dark){color-scheme:light}
body{font-family:"Satoshi",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--body);color:var(--subs);line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.container{width:100%;max-width:var(--maxw);margin-inline:auto;padding-inline:1.5rem}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--main);outline-offset:2px}
.ic{width:1.25rem;height:1.25rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic-fill{fill:currentColor;stroke:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font-weight:700;border-radius:var(--radius);transition:background .15s,color .15s;white-space:nowrap}
.btn-sm{min-height:2.5rem;padding:0 1rem;font-size:.875rem}
.btn-sm.sq{width:2.5rem;padding:0}
.btn-line-o{border:1px solid var(--line);color:var(--subs)}
.btn-lead{min-height:3rem;padding:0 1.5rem;background:var(--lead);color:var(--body);font-size:1rem}

header.top{position:sticky;top:0;z-index:40;background:var(--body)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:1.5rem;padding-block:1rem;position:relative}
.brand{display:flex;align-items:center;gap:.5rem;color:var(--lead);font-weight:700;font-size:1.375rem;letter-spacing:-.02em}
.brand-mark{width:2rem;height:2rem;border-radius:.5rem;background:var(--main);display:grid;place-items:center;color:#fff}
.search{position:relative;display:flex;width:18rem}
.search input{width:100%;min-height:2.5rem;border:1px solid var(--line);background:var(--soft);color:var(--lead);border-radius:var(--radius);padding:0 1rem;font:inherit;font-size:.875rem}

.hero{position:relative;overflow:hidden;color:var(--subs);background:#0c0c11}
.hero-track{display:flex;transition:transform .55s cubic-bezier(.65,0,.35,1)}
.slide{position:relative;display:grid;align-items:end;width:100%;flex:none;min-height:26rem}
.slide-in{position:relative;z-index:20;display:grid;gap:1rem;align-items:start;padding-block:4rem 3rem}
.slide h1{font-size:2.25rem;line-height:1.1;font-weight:700;color:var(--lead);max-width:34rem}
.slide-bg{position:absolute;inset:0;z-index:10;background:#0c0c11}
.slide-art{position:absolute;inset:0;opacity:.3}

.page{display:grid;gap:1.5rem;padding-block:2rem 3rem}
@media (min-width:1280px){.page{grid-template-columns:repeat(12,minmax(0,1fr))}main{grid-column:span 9}aside{grid-column:span 3}}
.grid-v{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:1rem}

.card{position:relative;color:var(--lead)}
.thumb{position:relative;border-radius:.5rem;overflow:hidden;background:#000;aspect-ratio:16/9}
.card-info{display:grid;gap:.25rem;padding:.5rem}
.card-info .ch{font-size:.6875rem;font-weight:700;text-transform:uppercase;color:var(--subs)}
.card-info h3{font-size:.875rem;font-weight:700;color:var(--lead)}
.card>a.cover{position:absolute;inset:0;z-index:20}
.empty{padding:2rem;text-align:center;grid-column:1/-1}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12.5-7.5a1 1 0 0 0 0-1.8L8.5 3.6A1 1 0 0 0 7 4.5z" fill="currentColor" stroke="none"/></symbol>
</svg>

<header class="top">
  <div class="container top-in">
    <a class="brand" href="index.html"><span class="brand-mark"><svg class="ic ic-fill" style="width:1rem;height:1rem"><use href="#i-play"/></svg></span>Vidlo</a>
    <div class="search">
      <form action="index.html" method="get" style="width:100%"><input type="search" name="q" placeholder="Buscar videos..." aria-label="Buscar" /></form>
    </div>
    <button class="btn btn-sm btn-line-o sq" id="modeBtn" aria-label="Claro / oscuro">
      <svg class="ic" id="icSun"><use href="#i-sun"/></svg><svg class="ic" id="icMoon" style="display:none"><use href="#i-moon"/></svg>
    </button>
  </div>
</header>

<section class="hero" id="heroSec">
  <div class="hero-track" id="track"></div>
</section>

<div class="container page">
  <main>
    <section>
      <h2 style="color:var(--lead);font-size:1.5rem;margin-bottom:1rem">Videos</h2>
      <div class="grid-v" id="gridVideos"></div>
    </section>
  </main>
</div>

<script src="api.js"></script>
<script>
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const q = (qs.get('q') || '').trim();

function renderHero(f) {
  if (!f || !f.length) { $('heroSec').style.display = 'none'; return; }
  const v = f[0];
  $('track').innerHTML = `
    <article class="slide">
      <div class="container slide-in">
        <h1>${esc(v.title)}</h1>
        <p>${esc(v.desc || '')}</p>
        <div><a class="btn btn-lead" href="watch.html?id=${v.id}">Ver video</a></div>
      </div>
      <div class="slide-bg"><div class="slide-art" style="${vidloBg(v, 110)}"></div></div>
    </article>`;
}

function renderGrid(list) {
  $('gridVideos').innerHTML = list.length ? list.map(v => `
    <article class="card">
      <div class="thumb" style="${vidloBg(v)}"></div>
      <header class="card-info"><div class="ch">${esc(v.ch)}</div><h3>${esc(v.title)}</h3></header>
      <a class="cover" href="watch.html?id=${v.id}"></a>
    </article>`).join('') : '<p class="empty">No se encontraron videos.</p>';
}

(async function init() {
  try {
    const list = await apiVideos({ q });
    renderHero(list);
    renderGrid(list);
  } catch (e) {
    $('gridVideos').innerHTML = '<p class="empty">Error al cargar videos.</p>';
  }
})();

const root = document.documentElement;
$('modeBtn').onclick = () => {
  const dark = !root.classList.contains('dark');
  root.classList.toggle('dark', dark);
  $('icSun').style.display = dark ? '' : 'none';
  $('icMoon').style.display = dark ? 'none' : '';
  try { localStorage.setItem('vidlo-mode', dark ? 'dark' : 'light'); } catch (e) {}
};
</script>
</body>
</html>
