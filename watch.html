<!doctype html>
<html lang="es" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ver video – Vidlo</title>
<script>try{if(localStorage.getItem('vidlo-mode')==='light')document.documentElement.classList.remove('dark')}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<link rel="preconnect" href="https://api.fontshare.com" />
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />
<style>
:root{
  --body:#0b0b10;--card:#10111a;--line:#21232f;--slate:#23263a;--slate2:#191b29;
  --lead:#ededf2;--subs:#8d90a3;--main:#2bb8a0;--on-main:#ffffff;--gold:#e3b53c;--indigo:#7480ff;
  --tabbar:#11121a;--radius:.75rem;
}
html:not(.dark){
  --body:#f4f5f9;--card:#ffffff;--line:#e1e4ec;--slate:#e4e7f1;--slate2:#eceef5;
  --lead:#14151c;--subs:#5f6377;--main:#13a58c;--gold:#d19a12;--indigo:#4c58e6;--tabbar:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}html:not(.dark){color-scheme:light}
body{font-family:"Satoshi",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--body);color:var(--subs);line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:5.5rem}
a{color:inherit;text-decoration:none}
button,select,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
img,svg{display:block}
:focus-visible{outline:2px solid var(--main);outline-offset:2px}
.wrap{width:100%;max-width:72rem;margin-inline:auto;padding-inline:1.4rem}
.ic{width:1.25rem;height:1.25rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-fill{fill:currentColor;stroke:none}
[hidden]{display:none!important}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:2.6rem;padding:0 1rem;border-radius:var(--radius);font-weight:500;font-size:.9rem;white-space:nowrap;transition:background .15s,border-color .15s,color .15s,opacity .15s}
.btn.sq{width:2.75rem;padding:0}
.btn.line{border:1px solid var(--line);color:var(--lead)}
.btn.slate{background:var(--slate);color:var(--lead)}
.btn.sm{min-height:2.2rem;padding:0 .8rem;font-size:.85rem}
.grow{flex:1}

header.top{position:sticky;top:0;z-index:40;background:var(--body)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-block:1.1rem}
.brand{display:flex;align-items:center;gap:.5rem;color:var(--lead);font-weight:700;font-size:1.375rem;letter-spacing:-.02em}
.brand-mark{width:2rem;height:2rem;border-radius:.5rem;background:#7c5cff;display:grid;place-items:center;color:#fff}

.layout{display:grid;gap:1.4rem;padding-block:.5rem 2rem;grid-template-areas:"stage" "ctrl" "serv" "eps" "info" "comments"}
.layout>*{min-width:0}
#stage{grid-area:stage}#ctrl{grid-area:ctrl}#serv{grid-area:serv}#eps{grid-area:eps}#info{grid-area:info}#comments{grid-area:comments}
@media (min-width:1024px){
  body{padding-bottom:0}
  .layout{grid-template-columns:minmax(0,1fr) 22rem;column-gap:2rem;padding-block:1rem 3rem;
    grid-template-areas:"stage eps" "ctrl eps" "serv eps" "info eps" "comments eps";grid-template-rows:auto auto auto auto 1fr}
  #eps{align-self:start;position:sticky;top:5.5rem}
}

.stage{position:relative;overflow:hidden;border-radius:var(--radius);background:#000;aspect-ratio:16/9}
.stage iframe,.stage video{position:absolute;inset:0;width:100%;height:100%;border:0}
.stage .poster{position:absolute;inset:0;background-size:cover;background-position:center}
.bigplay{position:absolute;inset:0;margin:auto;width:3.75rem;height:3.75rem;border-radius:50%;display:grid;place-items:center;border:4px solid rgba(255,255,255,.8);background:rgba(0,0,0,.25);color:rgba(255,255,255,.92);padding-left:3px}
.nosrc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:1.5rem;color:#d4d6e2;font-weight:500;background:rgba(0,0,0,.45)}

.ctrl{display:flex;gap:.6rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
.serv{display:flex;gap:.9rem;align-items:flex-start;padding:1.1rem}
.serv-l{display:flex;align-items:center;gap:.6rem;min-height:2.6rem;color:var(--subs);font-weight:500;font-size:.95rem}
.pills{display:flex;flex-wrap:wrap;gap:.5rem}
.pill{min-height:2.6rem;padding:0 1rem;border-radius:.625rem;background:var(--slate);color:var(--subs);font-weight:500;font-size:.9rem}
.pill.on{background:var(--main);color:var(--on-main)}

.eps{padding:1.25rem 1.1rem}
.eps-t{font-size:1.2rem;font-weight:700;color:var(--lead);margin:.15rem 0 1rem}
.nums{display:grid;grid-template-columns:repeat(6,1fr);gap:.55rem;max-height:20rem;overflow-y:auto}
.num{display:grid;place-items:center;min-height:2.6rem;border-radius:.625rem;background:var(--slate2);color:var(--subs);font-weight:500;font-size:.9rem}
.num.cur{background:var(--main);color:var(--on-main)}

.info{display:grid;gap:.9rem;justify-items:start}
.series{color:var(--main);font-size:1.15rem;font-weight:700}
.info h1{color:var(--lead);font-size:1.75rem;line-weight:1.15;font-weight:700}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .6rem;font-size:.95rem}

.c-item{display:grid;gap:.25rem;padding:.75rem;border:1px solid var(--line);border-radius:.5rem;background:var(--body)}
.c-head{display:flex;justify-content:space-between;font-size:.8rem;color:var(--subs)}
.c-head b{color:var(--lead)}

.toast{position:fixed;left:50%;bottom:6.5rem;transform:translate(-50%,1rem);z-index:60;background:var(--lead);color:var(--body);padding:.7rem 1.1rem;border-radius:.625rem;font-weight:700;font-size:.875rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12.5-7.5a1 1 0 0 0 0-1.8L8.5 3.6A1 1 0 0 0 7 4.5z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
</svg>

<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="index.html"><span class="brand-mark"><svg class="ic ic-fill" style="width:1rem;height:1rem"><use href="#i-play"/></svg></span>Vidlo</a>
  </div>
</header>

<div class="wrap layout">
  <div class="stage" id="stage"></div>

  <div class="ctrl" id="ctrl">
    <a class="btn line grow" id="prev" href="#">Anterior</a>
    <a class="btn line grow" id="next" href="#">Siguiente</a>
  </div>

  <div class="card serv" id="serv"></div>

  <section class="card eps" id="eps">
    <h2 class="eps-t" id="epsTitle">Videos</h2>
    <div class="nums" id="nums"></div>
  </section>

  <section class="info" id="info">
    <a class="series" id="ch" href="#"></a>
    <h1 id="title"></h1>
    <div class="meta" id="meta"></div>
    <p class="desc" id="desc"></p>
  </section>

  <section class="card" id="comments" style="padding:1.25rem">
    <h2 style="color:var(--lead);font-size:1.2rem;margin-bottom:1rem">Comentarios</h2>
    <div id="authBox" style="margin-bottom:1rem"></div>
    <form id="commentForm" style="display:grid;gap:.5rem;margin-bottom:1.5rem" hidden>
      <textarea id="commentText" placeholder="Escribe un comentario..." required style="width:100%;min-height:4.5rem;padding:.75rem;background:var(--body);border:1px solid var(--line);border-radius:var(--radius);color:var(--lead)"></textarea>
      <button class="btn slate sm" type="submit" style="justify-self:end">Publicar comentario</button>
    </form>
    <div id="commentsList" style="display:grid;gap:.75rem"></div>
  </section>
</div>

<!-- Modal Autenticación -->
<div id="authModal" style="position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:grid;place-items:center;padding:1rem" hidden>
  <div class="card" style="width:100%;max-width:22rem;padding:1.5rem;position:relative">
    <button id="closeAuth" style="position:absolute;top:.75rem;right:.75rem;color:var(--subs)"><svg class="ic"><use href="#i-x"/></svg></button>
    <h2 id="authTitle" style="color:var(--lead);font-size:1.25rem;margin-bottom:1rem">Iniciar sesión</h2>
    <form id="authForm" style="display:grid;gap:.8rem">
      <label style="display:grid;gap:.3rem;font-size:.85rem;color:var(--subs)">Usuario
        <input type="text" id="authUser" required style="padding:.6rem;background:var(--body);border:1px solid var(--line);border-radius:.5rem;color:var(--lead)" />
      </label>
      <label style="display:grid;gap:.3rem;font-size:.85rem;color:var(--subs)">Contraseña
        <input type="password" id="authPw" required style="padding:.6rem;background:var(--body);border:1px solid var(--line);border-radius:.5rem;color:var(--lead)" />
      </label>
      <button class="btn slate" type="submit" id="authSubmit" style="margin-top:.5rem">Entrar</button>
      <p id="authMsg" style="font-size:.85rem;color:var(--main)"></p>
    </form>
    <p style="margin-top:1rem;font-size:.85rem;text-align:center">
      <a href="#" id="toggleAuthMode" style="color:var(--main);text-decoration:underline">¿No tienes cuenta? Regístrate</a>
    </p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="api.js"></script>
<script>
const $ = id => document.getElementById(id);
const VIDEO_ID = parseInt(new URLSearchParams(location.search).get('id'), 10);

let tt;
const toast = msg => { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2200); };

let currentUser = null;
let authIsRegister = false;

async function checkUser() {
  if (!getToken()) { currentUser = null; updateAuthUI(); return; }
  try {
    const res = await apiFetch('/api/auth/me');
    currentUser = res.user;
  } catch (e) {
    setToken(''); currentUser = null;
  }
  updateAuthUI();
}

function updateAuthUI() {
  const box = $('authBox');
  const form = $('commentForm');
  if (currentUser) {
    box.innerHTML = `<span style="font-size:.9rem;color:var(--lead)">Conectado como <b>${esc(currentUser.username)}</b></span> <button id="logoutBtn" style="color:var(--main);font-size:.85rem;text-decoration:underline;margin-left:.5rem">Cerrar sesión</button>`;
    form.hidden = false;
    $('logoutBtn').onclick = () => { setToken(''); currentUser = null; updateAuthUI(); };
  } else {
    box.innerHTML = `<button class="btn slate sm" id="openAuthBtn">Iniciar sesión para comentar</button>`;
    form.hidden = true;
    $('openAuthBtn').onclick = () => {$('authModal').hidden = false; };
  }
}

async function loadComments() {
  try {
    const comments = await apiFetch(`/api/videos/${VIDEO_ID}/comments`);
    $('commentsList').innerHTML = comments.length ? comments.map(c => `
      <div class="c-item">
        <div class="c-head">
          <b>${esc(c.username)}</b>
          <span>${timeAgo(c.created_at)}</span>
        </div>
        <p style="color:var(--lead);font-size:.9rem">${esc(c.content)}</p>
        ${currentUser && currentUser.id === c.user_id ? `<button data-id="${c.id}" class="del-c" style="color:var(--danger);font-size:.75rem;justify-self:start;margin-top:.3rem">Eliminar</button>` : ''}
      </div>`).join('') : '<p style="font-size:.85rem">Aún no hay comentarios.</p>';
  } catch (e) {}
}

$('commentsList').addEventListener('click', async e => {
  if (!e.target.classList.contains('del-c')) return;
  const id = e.target.dataset.id;
  try {
    await apiFetch('/api/comments/' + id, { method: 'DELETE' });
    toast('Comentario eliminado');
    loadComments();
  } catch (err) { toast(err.message); }
});

$('commentForm').addEventListener('submit', async e => {
  e.preventDefault();
  const text = $('commentText').value.trim();
  if (!text) return;
  try {
    await apiFetch(`/api/videos/${VIDEO_ID}/comments`, { method: 'POST', body: JSON.stringify({ content: text }) });
    $('commentText').value = '';
    toast('Comentario publicado');
    loadComments();
  } catch (err) { toast(err.message); }
});

$('toggleAuthMode').onclick = e => {
  e.preventDefault();
  authIsRegister = !authIsRegister;
  $('authTitle').textContent = authIsRegister ? 'Crear cuenta' : 'Iniciar sesión';
  $('authSubmit').textContent = authIsRegister ? 'Registrarse' : 'Entrar';
  $('toggleAuthMode').textContent = authIsRegister ? '¿Ya tienes cuenta? Inicia sesión' : '¿No tienes cuenta? Regístrate';
};

$('closeAuth').onclick = () => {$('authModal').hidden = true; };

$('authForm').addEventListener('submit', async e => {
  e.preventDefault();
  const username = $('authUser').value.trim();
  const password = $('authPw').value;
  const path = authIsRegister ? '/api/auth/register' : '/api/auth/login';
  try {
    const res = await apiFetch(path, { method: 'POST', body: JSON.stringify({ username, password }) });
    setToken(res.token);
    currentUser = res.user;
    $('authModal').hidden = true;
    updateAuthUI();
    toast('Sesión iniciada');
  } catch (err) { $('authMsg').textContent = err.message; }
});

(async function main() {
  let VIDEOS = [];
  try { VIDEOS = await apiVideos(); } catch (e) { return; }
  if (!VIDEOS.length) return;

  let cur = VIDEOS.findIndex(x => x.id === VIDEO_ID);
  if (cur < 0) cur = 0;
  const v = VIDEOS[cur], N = VIDEOS.length;
  document.title = v.title + ' – Vidlo';

  let srcIdx = 0, playing = false, hlsInstance = null;
  const stage = $('stage');

  function renderStage() {
    const s = v.src[srcIdx];
    if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }

    if (playing && s) {
      const type = s.type || (s.embed.endsWith('.m3u8') ? 'hls' : 'iframe');

      if (type === 'hls' || s.embed.endsWith('.m3u8')) {
        stage.innerHTML = `<video id="vPlayer" controls autoplay style="width:100%;height:100%;background:#000"></video>`;
        const vp = $('vPlayer');
        if (Hls.isSupported()) {
          hlsInstance = new Hls();
          hlsInstance.loadSource(s.embed);
          hlsInstance.attachMedia(vp);
        } else if (vp.canPlayType('application/vnd.apple.mpegurl')) {
          vp.src = s.embed;
        } else {
          stage.innerHTML = `<p class="nosrc">El navegador no soporta transmisión HLS.</p>`;
        }
        return;
      }

      if (type === 'video') {
        stage.innerHTML = `<video src="${esc(s.embed)}" controls autoplay style="width:100%;height:100%;background:#000"></video>`;
        return;
      }

      stage.innerHTML = `<iframe src="${esc(s.embed)}" title="${esc(v.title)}" allowfullscreen allow="autoplay; fullscreen"></iframe>`;
      return;
    }

    stage.innerHTML = `<div class="poster" style="${vidloBg(v, 120)}"></div>` + (s
      ? `<button class="bigplay" id="bp" aria-label="Reproducir"><svg class="ic ic-fill"><use href="#i-play"/></svg></button>`
      : `<p class="nosrc">Sin fuente disponible.</p>`);
    if (s) $('bp').onclick = () => { playing = true; renderStage(); };
  }

  $('ch').textContent = v.ch;
  $('title').textContent = v.title;
  $('meta').innerHTML = [v.cat, v.year, v.dur, timeAgo(v.created)].filter(Boolean).map(x => `<span>${esc(x)}</span>`).join(' • ');
  $('desc').textContent = v.desc || '';

  $('nums').innerHTML = VIDEOS.map((x, i) => `<a class="num${i === cur ? ' cur' : ''}" href="watch.html?id=${x.id}">${i + 1}</a>`).join('');

  function renderServ() {
    $('serv').innerHTML = `<div class="serv-l"><span>Fuentes</span></div>` +
      (v.src.length
        ? `<div class="pills">${v.src.map((s, i) => `<button class="pill${i === srcIdx ? ' on' : ''}" data-i="${i}">${esc(s.n)}</button>`).join('')}</div>`
        : `<div>Sin fuentes</div>`);
  }
  $('serv').addEventListener('click', e => {
    const b = e.target.closest('.pill'); if (!b) return;
    srcIdx = +b.dataset.i; renderServ(); renderStage();
  });

  renderStage(); renderServ();
  await checkUser();
  loadComments();
})();
</script>
</body>
</html>
