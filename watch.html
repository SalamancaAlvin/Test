<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ver video – Vidlo</title>
<script>try{if(localStorage.getItem('vidlo-mode')==='light')document.documentElement.classList.remove('dark')}catch(e){}</script>

<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />
<style>
/* ============ Tokens ============ */
:root{
  --body:#0b0b10;
  --card:#10111a;
  --line:#21232f;
  --slate:#23263a;      /* botones rellenos */
  --slate2:#191b29;     /* casillas numeradas */
  --lead:#ededf2;
  --subs:#8d90a3;
  --main:#2bb8a0;       /* acento verde azulado */
  --on-main:#ffffff;
  --gold:#e3b53c;
  --indigo:#7480ff;
  --tabbar:#11121a;
  --radius:.75rem;
}
html:not(.dark){
  --body:#f4f5f9; --card:#ffffff; --line:#e1e4ec; --slate:#e4e7f1; --slate2:#eceef5;
  --lead:#14151c; --subs:#5f6377; --main:#13a58c; --gold:#d19a12; --indigo:#4c58e6; --tabbar:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
html:not(.dark){color-scheme:light}
body{
  font-family:"Satoshi",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--body);color:var(--subs);line-height:1.5;min-height:100vh;
  -webkit-font-smoothing:antialiased;padding-bottom:5.5rem;
}
a{color:inherit;text-decoration:none}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
img,svg{display:block}
:focus-visible{outline:2px solid var(--main);outline-offset:2px}
.wrap{width:100%;max-width:72rem;margin-inline:auto;padding-inline:1.4rem}
.ic{width:1.25rem;height:1.25rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-fill{fill:currentColor;stroke:none}
[hidden]{display:none!important}

/* ============ Botones ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:2.6rem;padding:0 1rem;
  border-radius:var(--radius);font-weight:500;font-size:.9rem;white-space:nowrap;transition:background .15s,border-color .15s,color .15s,opacity .15s}
.btn.sq{width:2.75rem;padding:0}
.btn.line{border:1px solid var(--line);color:var(--lead)}
.btn.line:hover{border-color:var(--subs)}
.btn.slate{background:var(--slate);color:var(--lead)}
.btn.slate:hover{filter:brightness(1.15)}
.btn[aria-disabled="true"]{opacity:.4;pointer-events:none}
.btn[aria-pressed="true"]{background:color-mix(in srgb,var(--main) 25%,var(--slate));color:var(--main)}
.grow{flex:1}

/* ============ Header ============ */
header.top{position:sticky;top:0;z-index:40;background:var(--body)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-block:1.1rem}
.brand{display:flex;align-items:center;gap:.5rem;color:var(--lead);font-weight:700;font-size:1.375rem;letter-spacing:-.02em}
.brand-mark{width:2rem;height:2rem;border-radius:.5rem;background:#7c5cff;display:grid;place-items:center;color:#fff}
.top-r{display:flex;align-items:center;gap:.5rem}
.community{width:2.75rem;height:2.75rem;display:grid;place-items:center;color:var(--indigo)}
.community .ic{width:1.6rem;height:1.6rem}
.dnav{display:none;margin-right:.75rem}
.dnav a{padding:.5rem .85rem;border-radius:.5rem;font-weight:500;font-size:.9rem}
.dnav a:hover{background:var(--card);color:var(--lead)}
.sbar{border-top:1px solid var(--line);background:var(--body);padding-block:.75rem}
.sbar input{width:100%;min-height:2.6rem;border:1px solid var(--line);background:var(--card);border-radius:var(--radius);padding:0 1rem;color:var(--lead)}
.sbar input::placeholder{color:var(--subs)}
html:not(.dark) #icMoon{display:block}
#icMoon{display:none}
html:not(.dark) #icSun{display:none}

/* ============ Layout ============ */
.layout{display:grid;gap:1.4rem;padding-block:.5rem 2rem;
  grid-template-areas:"stage" "ctrl" "serv" "eps" "info"}
.layout>*{min-width:0}
#stage{grid-area:stage}
#ctrl{grid-area:ctrl}
#serv{grid-area:serv}
#eps{grid-area:eps}
#info{grid-area:info}
@media (min-width:1024px){
  body{padding-bottom:0}
  .layout{grid-template-columns:minmax(0,1fr) 22rem;column-gap:2rem;padding-block:1rem 3rem;
    grid-template-areas:"stage eps" "ctrl eps" "serv eps" "info eps";grid-template-rows:auto auto auto 1fr}
  #eps{align-self:start;position:sticky;top:5.5rem}
  .dnav{display:flex}
}

/* ============ Reproductor ============ */
.stage{position:relative;overflow:hidden;border-radius:var(--radius);background:#000;aspect-ratio:21/16}
@media (min-width:640px){ .stage{aspect-ratio:16/9} }
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.stage .poster{position:absolute;inset:0;background-size:cover;background-position:center}
.stage img.poster{object-fit:cover;width:100%;height:100%}
.bigplay{position:absolute;inset:0;margin:auto;width:3.75rem;height:3.75rem;border-radius:50%;display:grid;place-items:center;
  border:4px solid rgba(255,255,255,.8);background:rgba(0,0,0,.25);color:rgba(255,255,255,.92);padding-left:3px;
  transition:transform .15s,background .15s}
.bigplay:hover{transform:scale(1.06);background:rgba(0,0,0,.4)}
.bigplay .ic{width:1.6rem;height:1.6rem}
.nosrc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:1.5rem;color:#d4d6e2;font-weight:500;
  background:rgba(0,0,0,.45)}

/* ============ Controles ============ */
.ctrl{display:flex;gap:.6rem}

/* ============ Servidores ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
.serv{display:flex;gap:.9rem;align-items:flex-start;padding:1.1rem 1.1rem}
.serv-l{display:flex;align-items:center;gap:.6rem;min-height:2.6rem;color:var(--subs);font-weight:500;font-size:.95rem}
.serv-l .ic{color:var(--main);width:1.5rem;height:1.5rem}
.pills{display:flex;flex-wrap:wrap;gap:.5rem}
.pill{min-height:2.6rem;padding:0 1rem;border-radius:.625rem;background:var(--slate);color:var(--subs);font-weight:500;font-size:.9rem}
.pill:hover{color:var(--lead)}
.pill.on{background:var(--main);color:var(--on-main)}
.serv-empty{min-height:2.6rem;display:flex;align-items:center;font-size:.9rem}

/* ============ Lista numerada ============ */
.eps{padding:1.25rem 1.1rem}
.eps-k{font-size:.9rem;color:var(--subs)}
.eps-t{font-size:1.2rem;font-weight:700;color:var(--lead);margin:.15rem 0 1rem}
.eps-tools{display:flex;gap:.6rem;margin-bottom:.9rem}
.select{position:relative;flex:1;min-width:0}
.select select{appearance:none;-webkit-appearance:none;width:100%;min-height:2.75rem;padding:0 2.5rem 0 1rem;
  background:transparent;border:1px solid var(--line);border-radius:var(--radius);color:var(--lead);font-size:.95rem;cursor:pointer}
.select select option{background:var(--card);color:var(--lead)}
.select .ic{position:absolute;right:.9rem;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--subs)}
.find{width:100%;min-height:2.6rem;margin-bottom:.9rem;padding:0 1rem;border:1px solid var(--line);background:var(--body);border-radius:var(--radius);color:var(--lead)}
.nums{display:grid;grid-template-columns:repeat(6,1fr);gap:.55rem;max-height:20rem;overflow-y:auto;padding-right:.15rem}
.num{display:grid;place-items:center;min-height:2.6rem;border-radius:.625rem;background:var(--slate2);color:var(--subs);font-weight:500;font-size:.9rem;
  transition:background .15s,color .15s}
.num:hover{color:var(--lead);background:var(--slate)}
.num.cur{background:var(--main);color:var(--on-main)}
@media (min-width:1024px){ .nums{grid-template-columns:repeat(5,1fr)} }

/* ============ Información ============ */
.info{display:grid;gap:.9rem;justify-items:start}
.series{color:var(--main);font-size:1.15rem;font-weight:700}
.series:hover{text-decoration:underline}
.info h1{color:var(--lead);font-size:1.75rem;line-height:1.15;font-weight:700;letter-spacing:-.01em}
@media (min-width:1024px){ .info h1{font-size:2.25rem} }
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .6rem;font-size:.95rem}
.tags{display:flex;flex-wrap:wrap;gap:.5rem}
.tag{display:inline-flex;align-items:center;min-height:2.4rem;padding:0 1.2rem;border:1px solid var(--line);border-radius:999px;font-size:.9rem;font-weight:500;color:var(--subs)}
.tag:hover{color:var(--lead);border-color:var(--subs)}
.desc{color:var(--lead);opacity:.9;font-size:.95rem;line-height:1.7;max-width:46rem;cursor:pointer;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.desc.open{display:block;-webkit-line-clamp:unset}
.row-end{display:flex;flex-wrap:wrap;gap:.75rem;align-items:stretch;margin-top:.4rem}
.rating{display:flex;align-items:center;gap:.8rem;padding:.7rem 1.1rem;border:1px solid var(--line);background:var(--card);border-radius:var(--radius)}
.rating .ic{width:1.9rem;height:1.9rem;color:var(--gold)}
.rating b{font-size:2rem;line-height:1;font-weight:700;color:var(--lead)}
.rating small{display:block;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--subs)}
.rating span{font-size:.9rem;font-weight:700;color:var(--subs)}
.sqb{width:3.3rem;display:grid;place-items:center;border:1px solid var(--line);border-radius:var(--radius);color:var(--subs)}
.sqb:hover{color:var(--lead);border-color:var(--subs)}

/* ============ Barra inferior (móvil) ============ */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--tabbar);border-top:1px solid var(--line);padding:.6rem .25rem calc(.6rem + env(safe-area-inset-bottom))}
.tabbar a{display:grid;justify-items:center;gap:.2rem;font-size:.72rem;font-weight:500;color:var(--subs);padding:.15rem 0}
.tabbar a:hover,.tabbar a.on{color:var(--lead)}
.tabbar .ic{width:1.75rem;height:1.75rem;stroke-width:1.6}
@media (min-width:1024px){ .tabbar{display:none} }

/* ============ Aviso ============ */
.toast{position:fixed;left:50%;bottom:6.5rem;transform:translate(-50%,1rem);z-index:60;background:var(--lead);color:var(--body);
  padding:.7rem 1.1rem;border-radius:.625rem;font-weight:700;font-size:.875rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:1024px){ .toast{bottom:2rem} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N = VIDEOS.length;

/* ---------- Video actual (?v=0) ---------- */
let cur = parseInt(new URLSearchParams(location.search).get('v'), 10);
cur = Number.isFinite(cur) ? Math.min(Math.max(cur, 0), N - 1) : 0;
const v = VIDEOS[cur];
document.title = v.title + ' – Vidlo';

/* ---------- Toast ---------- */
let tt;
const toast = msg => { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2200); };

/* ---------- Reproductor ---------- */
const stage = $('stage');
let srcIdx = 0, playing = false;
function renderStage() {
  const s = v.src[srcIdx];
  if (playing && s) {
    stage.innerHTML = `<iframe src="${esc(s.embed)}" title="${esc(v.title)}" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe>`;
    return;
  }
  const poster = v.thumb ? `<img class="poster" src="${esc(v.thumb)}" alt="">` : `<div class="poster" style="${vidloArt(cur, 120)}"></div>`;
  stage.innerHTML = poster + (s
    ? `<button class="bigplay" id="bp" aria-label="Reproducir"><svg class="ic ic-fill"><use href="#i-play"/></svg></button>`
    : `<p class="nosrc">Este video aún no tiene una fuente disponible.</p>`);
  if (s) $('bp').onclick = () => { playing = true; renderStage(); };
}

/* ---------- Controles ---------- */
const prev = $('prev'), next = $('next');
if (cur > 0) prev.href = `watch.html?v=${cur - 1}`; else { prev.setAttribute('aria-disabled', 'true'); prev.removeAttribute('href'); }
if (cur < N - 1) next.href = `watch.html?v=${cur + 1}`; else { next.setAttribute('aria-disabled', 'true'); next.removeAttribute('href'); }

const seenBtn = $('seen');
const readSeen = () => { try { return JSON.parse(localStorage.getItem('vidlo-seen') || '[]'); } catch (e) { return []; } };
const paintSeen = () => seenBtn.setAttribute('aria-pressed', readSeen().includes(cur));
paintSeen();
seenBtn.onclick = () => {
  let a = readSeen(); const on = !a.includes(cur);
  a = on ? [...a, cur] : a.filter(x => x !== cur);
  try { localStorage.setItem('vidlo-seen', JSON.stringify(a)); } catch (e) {}
  paintSeen(); toast(on ? 'Marcado como visto' : 'Marcado como no visto');
};

const dl = $('dl');
const renderDl = () => {
  const s = v.src[srcIdx];
  if (s && s.dl) { dl.href = s.dl; dl.removeAttribute('aria-disabled'); }
  else { dl.removeAttribute('href'); dl.setAttribute('aria-disabled', 'true'); }
};

/* ---------- Fuentes ---------- */
function renderServ() {
  $('serv').innerHTML = `<div class="serv-l"><svg class="ic"><use href="#i-video"/></svg><span>Video</span></div>` +
    (v.src.length
      ? `<div class="pills">${v.src.map((s, i) => `<button class="pill${i === srcIdx ? ' on' : ''}" data-i="${i}">${esc(s.n)}</button>`).join('')}</div>`
      : `<div class="serv-empty">Sin fuentes</div>`);
}
$('serv').addEventListener('click', e => {
  const b = e.target.closest('.pill'); if (!b) return;
  srcIdx = +b.dataset.i; renderServ(); renderDl(); renderStage();
});

/* ---------- Lista numerada ---------- */
const SIZE = 100;
const range = $('range'), nums = $('nums');
let desc = false;
$('epsTitle').textContent = 'Video ' + (cur + 1);
const chunks = Math.ceil(N / SIZE);
range.innerHTML = Array.from({length: chunks}, (_, k) => `<option value="${k}">${k * SIZE + 1} - ${Math.min(N, (k + 1) * SIZE)}</option>`).join('');
range.value = Math.floor(cur / SIZE);
function renderNums() {
  const k = +range.value, items = [];
  for (let n = k * SIZE + 1; n <= Math.min(N, (k + 1) * SIZE); n++) items.push(n);
  if (desc) items.reverse();
  nums.innerHTML = items.map(n => `<a class="num${n - 1 === cur ? ' cur' : ''}" href="watch.html?v=${n - 1}" title="${esc(VIDEOS[n - 1].title)}"${n - 1 === cur ? ' aria-current="true"' : ''}>${n}</a>`).join('');
  const c = nums.querySelector('.cur'); if (c) c.scrollIntoView({block: 'nearest'});
}
range.onchange = renderNums;
$('epsSort').onclick = e => { desc = !desc; e.currentTarget.setAttribute('aria-pressed', desc); renderNums(); };
$('epsSearch').onclick = () => { const f = $('find'); f.hidden = !f.hidden; if (!f.hidden) f.focus(); };
$('find').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const n = parseInt(e.target.value, 10);
  if (n >= 1 && n <= N) location.href = `watch.html?v=${n - 1}`; else toast(`Escribe un número entre 1 y ${N}`);
});

/* ---------- Información ---------- */
$('ch').textContent = v.ch; $('ch').href = '#';
$('title').textContent = v.title;
$('meta').innerHTML = [v.cat, v.year, v.dur, v.when].filter(Boolean).map(x => `<span>${esc(x)}</span>`).join('<span>•</span>');
$('tags').innerHTML = v.tags.map(t => `<a class="tag" href="#">${esc(t)}</a>`).join('');
$('desc').textContent = v.desc;
$('rate').textContent = v.rating;
$('votes').textContent = v.votes + ' votos';
const d = $('desc');
const toggleDesc = () => { const o = d.classList.toggle('open'); d.setAttribute('aria-expanded', o); };
d.onclick = toggleDesc;
d.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleDesc(); } });

$('share').onclick = async () => {
  try {
    if (navigator.share) { await navigator.share({title: v.title, url: location.href}); return; }
    await navigator.clipboard.writeText(location.href); toast('Enlace copiado');
  } catch (e) { /* cancelado */ }
};
$('flag').onclick = () => toast('Gracias, revisaremos este video');

/* ---------- Tema y búsqueda ---------- */
$('modeBtn').onclick = () => {
  const dark = !document.documentElement.classList.contains('dark');
  document.documentElement.classList.toggle('dark', dark);
  try { localStorage.setItem('vidlo-mode', dark ? 'dark' : 'light'); } catch (e) {}
};
$('searchBtn').onclick = e => {
  const sb = $('sbar'); sb.hidden = !sb.hidden;
  e.currentTarget.setAttribute('aria-expanded', !sb.hidden);
  $('icS').firstElementChild.setAttribute('href', sb.hidden ? '#i-search' : '#i-x');
  if (!sb.hidden) sb.querySelector('input').focus();
};

/* ---------- Inicio ---------- */
renderStage(); renderServ(); renderDl(); renderNums();
</script>
</body>
</html>
